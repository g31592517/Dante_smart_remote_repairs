# Production reverse proxy: serves the built web app and proxies the API on ONE origin (HTTPS).
# Replace example.com, then obtain certificates (e.g. certbot --nginx -d example.com).
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 30m;   # 5 uploads × MAX_UPLOAD_MB plus form overhead

    # API (and the payment-gateway webhook at /api/v1/payments/webhooks/gateway)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # public catalogue images served by the API from STORAGE_DIR/public
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_cache_valid 200 30d;
    }

    # web app (apps/web/dist)
    root /srv/dante/apps/web/dist;
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
